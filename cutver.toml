[project]
name = "sandbox"

[[manifest]]
path = "package.json"
kind = "json"
field = "version"

[changelog]
path = "CHANGELOG.md"
format = "keep-a-changelog"

[git]
tag_prefix = "v"
commit_message = "chore(release): v{{ version }} [skip ci]"
require_clean_tree = true
require_branch = "main"

[plugins.github-publish]
runtime = "wasm"
source = "github-publish-0.1.0.wasm"
hash = "dd14ccf19957d411c322ed1d419f5d5569f914d9fc63bb14340874b823c735d2"
capabilities = ["lifecycle.v1"]
events = ["on_pre_bump", "on_post_release"]

[plugins.github-publish.permissions]
network = ["api.github.com", "uploads.github.com"]
env = ["GITHUB_TOKEN"]
filesystem = ["."]

[plugins.github-publish.config]
repository = "cutver/sandbox"
