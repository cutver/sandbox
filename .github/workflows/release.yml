name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump level"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Canary Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate Cutver bot token
        id: bot-token
        if: env.CUTVER_APP_ID != '' && env.CUTVER_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
        env:
          CUTVER_APP_ID: ${{ secrets.CUTVER_APP_ID }}
          CUTVER_APP_PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - name: Setup Git bot credentials
        run: |
          git config --global user.name "cutver-release[bot]"
          git config --global user.email "${{ secrets.CUTVER_APP_ID || 'github-actions' }}+cutver-release[bot]@users.noreply.github.com"

      - name: Setup Cutver CLI with plugins
        uses: cutver/setup@v1
        with:
          plugins: "true"

      # Single source of truth: `source` and `hash` live in cutver.toml, the command writes into the
      # cache root the host resolves from $HOME, and it verifies the digest before accepting the
      # file. Resolving the URL goes through the Cutver registry, so the pinned version must be
      # indexed there before a release.
      - name: Restore declared Cutver plugins
        run: cutver plugin restore

      - name: Run Cutver Release
        id: cutver
        uses: cutver/release@v1
        with:
          command: "release"
          bump: ${{ inputs.bump || 'auto' }}
          template: ".github/templates/cutver/RELEASE.md"
          check-changelog: "true"
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Push release commit
        run: git push origin main

      - name: Upload assets into the draft release
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cutver.outputs.tag }}
        run: |
          # Practice stand-in: the sandbox builds no binaries, so the notes and a marker stand in
          # for the platform archives. The guard, the upload and the promotion are the real logic.
          mkdir -p dist
          cp CHANGELOG.md dist/SANDBOX-CHANGELOG.md
          printf 'tag=%s practice=draft-then-publish\n' "$TAG" > dist/SANDBOX-MARKER.txt
          if state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>&1); then
            case "$state" in
              draft|published) echo "release $TAG is $state; uploading assets" ;;
              *)
                echo "::error::Unexpected release state for $TAG: '$state'."
                exit 1
                ;;
            esac
          else
            echo "::error::Could not read the release for $TAG: $state"
            echo "::error::If it does not exist, github-publish never created its draft: check the plugin-enabled build and on_post_release."
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cutver.outputs.tag }}
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end')
          case "$state" in
            published)
              echo "release $TAG is already published; nothing to promote"
              exit 0
              ;;
            draft) ;;
            *)
              echo "::error::Refusing to promote $TAG: expected a draft, got '$state'."
              exit 1
              ;;
          esac
          # The plugin owns the body: it is already the rendered entry. Overwriting it with the whole
          # changelog file would make the canary lie about what production publishes.
          gh release edit "$TAG" --draft=false --title "Release $TAG"
          gh release view "$TAG" --json isDraft,tagName --jq 'if .isDraft then error("release is still a draft after publishing") else "published \(.tagName)" end'
