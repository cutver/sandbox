name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump level"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Canary Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate Cutver bot token
        id: bot-token
        if: env.CUTVER_APP_ID != '' && env.CUTVER_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
        env:
          CUTVER_APP_ID: ${{ secrets.CUTVER_APP_ID }}
          CUTVER_APP_PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - name: Setup Git bot credentials
        run: |
          git config --global user.name "cutver-release[bot]"
          git config --global user.email "${{ secrets.CUTVER_APP_ID || 'github-actions' }}+cutver-release[bot]@users.noreply.github.com"

      - name: Setup Cutver CLI with plugins
        uses: cutver/setup@v1
        with:
          plugins: "true"

      - name: Fetch Cutver plugins
        run: |
          mkdir -p ~/.cache/cutver/plugins
          curl -sL https://github.com/cutver/plugins/releases/download/github-publish-v0.1.2/github-publish.wasm \
            -o ~/.cache/cutver/plugins/github-publish-0.1.2.wasm

      - name: Run Cutver Release
        uses: cutver/release@v1
        with:
          command: "release"
          bump: ${{ inputs.bump || 'minor' }}
          template: ".github/templates/cutver/RELEASE.md"
          check-changelog: "false"
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Push release commit
        run: git push origin main
